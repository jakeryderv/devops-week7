[project]
name = "week7"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]==3.2.10",
    "sqlalchemy==2.0.44",
    "streamlit==1.50.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
