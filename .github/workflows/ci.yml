name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check lint
        run: uv run --locked ruff check app tests
      - name: Check formatting
        run: uv run --locked ruff format --check app tests
      - name: Check types
        run: uv run --locked ty check
      - name: Run tests
        run: uv run --locked python -m pytest -v
      - name: Check generated runtime requirements
        run: |
          uv export --quiet --locked --no-dev --no-emit-project --no-header --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
